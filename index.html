<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>PagaMeno$ | Monitor de Ofertas Amazon & ML</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#0a0a0a',
                            card: '#141414',
                            border: '#262626',
                            green: '#c8ff00',
                            'green-dim': '#9acd32',
                            gold: '#ffd700',
                            'gold-dim': '#b8860b',
                            surface: '#1a1a1a'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                        display: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.4s ease-out forwards',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'shimmer': 'shimmer 2s linear infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(12px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        shimmer: {
                            '0%': { backgroundPosition: '-1000px 0' },
                            '100%': { backgroundPosition: '1000px 0' },
                        }
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
            color: #e5e5e5;
        }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #444; }
        
        .text-glow-green { text-shadow: 0 0 20px rgba(200, 255, 0, 0.3); }
        .text-glow-gold { text-shadow: 0 0 20px rgba(255, 215, 0, 0.3); }
        
        .card-hover {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px -12px rgba(200, 255, 0, 0.08);
            border-color: rgba(200, 255, 0, 0.3);
        }
        
        .btn-amazon {
            background: linear-gradient(135deg, #1f2937 0%, #111827 100%);
            border: 1px solid #374151;
            color: #f3f4f6;
        }
        .btn-amazon:hover {
            background: linear-gradient(135deg, #c8ff00 0%, #9acd32 100%);
            border-color: #c8ff00;
            color: #0a0a0a;
            box-shadow: 0 0 15px rgba(200, 255, 0, 0.3);
        }
        
        .btn-ml {
            background: linear-gradient(135deg, #fff159 0%, #ffe600 100%);
            border: 1px solid #ffe600;
            color: #2d3277;
        }
        .btn-ml:hover {
            background: linear-gradient(135deg, #ffe600 0%, #ffd100 100%);
            box-shadow: 0 0 15px rgba(255, 230, 0, 0.3);
            transform: translateY(-1px);
        }
        
        .discount-badge {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.4);
        }
        
        .skeleton {
            background: linear-gradient(90deg, #1a1a1a 25%, #262626 50%, #1a1a1a 75%);
            background-size: 1000px 100%;
            animation: shimmer 2s infinite linear;
        }
        
        .glass-bar {
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        
        .store-filter.active {
            background: rgba(200, 255, 0, 0.15);
            border-color: rgba(200, 255, 0, 0.5);
            color: #c8ff00;
        }

        /* Custom select arrow fix */
        select {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.5rem center;
            background-repeat: no-repeat;
            background-size: 1.5em 1.5em;
            padding-right: 2.5rem;
            -webkit-appearance: none;
            appearance: none;
        }
    </style>
</head>
<body class="min-h-screen antialiased selection:bg-brand-green selection:text-black">

    <!-- Sticky Header -->
    <header class="sticky top-0 z-50 glass-bar">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col sm:flex-row items-center justify-between py-4 gap-4">
                <div class="flex items-center gap-3">
                    <div class="relative">
                        <h1 class="text-3xl sm:text-4xl font-black tracking-tight leading-none">
                            <span class="text-brand-green text-glow-green">Paga</span><span class="text-brand-gold text-glow-gold">Meno$</span>
                        </h1>
                        <div class="flex items-center gap-1.5 mt-1">
                            <span class="inline-block w-1.5 h-1.5 rounded-full bg-brand-green animate-pulse"></span>
                            <p class="text-[11px] sm:text-xs text-neutral-500 font-medium tracking-wide uppercase">Monitor de Ofertas • Amazon & Mercado Livre</p>
                        </div>
                    </div>
                </div>

                <div class="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-end">
                    <button id="btn-notification" class="hidden items-center gap-2 px-3 py-2 rounded-lg bg-neutral-800/80 border border-neutral-700 text-xs font-medium text-neutral-300 hover:bg-neutral-700 transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                        <span class="hidden sm:inline">Ativar Notificações</span>
                    </button>

                    <div class="flex items-center gap-3 bg-neutral-900/60 rounded-lg px-3 py-2 border border-neutral-800">
                        <div class="text-right hidden sm:block">
                            <div id="label-last-check" class="text-[10px] text-neutral-500 font-mono">Carregando...</div>
                            <div class="flex items-center justify-end gap-1.5">
                                <span class="relative flex h-2 w-2">
                                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-brand-green opacity-75"></span>
                                    <span class="relative inline-flex rounded-full h-2 w-2 bg-brand-green"></span>
                                </span>
                                <span id="label-timer" class="text-xs text-brand-green font-mono font-bold">10:00</span>
                            </div>
                        </div>
                        <button id="btn-refresh" class="group relative flex items-center justify-center w-9 h-9 rounded-lg bg-brand-green text-black hover:bg-brand-green/90 transition-all active:scale-95">
                            <svg id="spinner" class="hidden animate-spin w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            <svg id="refresh-icon" class="w-5 h-5 group-hover:rotate-180 transition-transform duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Filters Bar -->
    <div class="border-b border-neutral-800 bg-neutral-900/30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <div class="flex flex-col xl:flex-row gap-4 items-stretch xl:items-center justify-between">
                
                <!-- Search -->
                <div class="relative flex-1 max-w-xl">
                    <svg class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-neutral-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    <input type="text" id="search-input" placeholder="Buscar produtos, categorias..." 
                        class="w-full pl-10 pr-4 py-2.5 bg-neutral-900 border border-neutral-800 rounded-xl text-sm text-neutral-200 placeholder-neutral-600 focus:outline-none focus:border-brand-green/50 focus:ring-1 focus:ring-brand-green/20 transition-all">
                </div>

                <!-- Filters Group -->
                <div class="flex flex-wrap items-center gap-3">
                    <!-- Store Toggles -->
                    <div class="flex items-center bg-neutral-900 rounded-lg p-1 border border-neutral-800">
                        <button data-store="all" class="store-filter active px-3 py-1.5 rounded-md text-xs font-semibold text-neutral-400 transition-all">Todas</button>
                        <button data-store="amazon" class="store-filter px-3 py-1.5 rounded-md text-xs font-semibold text-neutral-400 transition-all flex items-center gap-1.5">
                            <span class="w-1.5 h-1.5 rounded-full bg-neutral-500"></span> Amazon
                        </button>
                        <button data-store="ml" class="store-filter px-3 py-1.5 rounded-md text-xs font-semibold text-neutral-400 transition-all flex items-center gap-1.5">
                            <span class="w-1.5 h-1.5 rounded-full bg-neutral-500"></span> ML
                        </button>
                    </div>

                    <!-- Category Filter -->
                    <div class="relative">
                        <select id="category-select" class="bg-neutral-900 border border-neutral-800 text-neutral-300 text-xs font-semibold rounded-lg pl-3 pr-8 py-2.5 focus:outline-none focus:border-brand-green/50 cursor-pointer hover:bg-neutral-800 transition-colors min-w-[160px]">
                            <option value="all">Todas Categorias</option>
                            <option value="💻 Eletrônicos & Informática">💻 Eletrônicos & Informática</option>
                            <option value="❄️ Eletrodomésticos & Casa">❄️ Eletrodomésticos & Casa</option>
                            <option value="👕 Moda & Acessórios">👕 Moda & Acessórios</option>
                            <option value="🧴 Beleza & Cuidado Pessoal">🧴 Beleza & Cuidado Pessoal</option>
                            <option value="🎮 Games & Lazer">🎮 Games & Lazer</option>
                            <option value="🛒 Supermercado & Bebidas">🛒 Supermercado & Bebidas</option>
                            <option value="⚽ Esportes & Saúde">⚽ Esportes & Saúde</option>
                            <option value="🧸 Bebês & Brinquedos">🧸 Bebês & Brinquedos</option>
                        </select>
                    </div>

                    <!-- Sort -->
                    <div class="relative">
                        <select id="sort-select" class="bg-neutral-900 border border-neutral-800 text-neutral-300 text-xs font-semibold rounded-lg pl-3 pr-8 py-2.5 focus:outline-none focus:border-brand-green/50 cursor-pointer hover:bg-neutral-800 transition-colors">
                            <option value="recent">Mais Recentes</option>
                            <option value="price_asc">Menor Preço</option>
                            <option value="price_desc">Maior Preço</option>
                            <option value="discount_desc">Maior Desconto</option>
                        </select>
                    </div>

                    <!-- Counter -->
                    <div class="hidden sm:flex items-center px-3 py-2 bg-neutral-900 border border-neutral-800 rounded-lg">
                        <span id="item-counter" class="text-xs font-bold text-brand-green">0</span>
                        <span class="text-xs text-neutral-500 ml-1">ofertas</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        
        <!-- Mobile Timer -->
        <div class="sm:hidden flex items-center justify-between mb-4 text-xs text-neutral-500 font-mono">
            <span id="label-last-check-mobile">Carregando...</span>
            <span id="label-timer-mobile" class="text-brand-green font-bold">10:00</span>
        </div>

        <!-- Active Filters Tags -->
        <div id="active-filters" class="hidden flex-wrap gap-2 mb-4"></div>

        <!-- Grid -->
        <div id="grid-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 sm:gap-5"></div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden flex flex-col items-center justify-center py-20 text-center">
            <div class="w-20 h-20 rounded-full bg-neutral-900 border border-neutral-800 flex items-center justify-center mb-4">
                <svg class="w-8 h-8 text-neutral-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
            <h3 class="text-lg font-semibold text-neutral-300 mb-1">Nenhuma oferta encontrada</h3>
            <p class="text-sm text-neutral-500 max-w-xs">Tente ajustar os filtros ou aguarde a próxima atualização automática.</p>
        </div>

        <!-- Skeleton Loader -->
        <div id="skeleton-loader" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 sm:gap-5">
            <script>
                document.write(Array(8).fill(0).map(() => `
                    <div class="bg-brand-card border border-brand-border rounded-2xl overflow-hidden">
                        <div class="aspect-[4/3] skeleton"></div>
                        <div class="p-4 space-y-3">
                            <div class="h-3 w-1/3 skeleton rounded"></div>
                            <div class="h-4 w-3/4 skeleton rounded"></div>
                            <div class="h-4 w-full skeleton rounded"></div>
                            <div class="flex justify-between items-end pt-2">
                                <div class="h-6 w-20 skeleton rounded"></div>
                                <div class="h-8 w-28 skeleton rounded-lg"></div>
                            </div>
                        </div>
                    </div>
                `).join(''));
            </script>
        </div>
    </main>

    <footer class="border-t border-neutral-800 mt-12 py-8 bg-neutral-900/30">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p class="text-xs text-neutral-600">PagaMeno$ • Monitor inteligente de ofertas Amazon & Mercado Livre</p>
        </div>
    </footer>

    <script>
        // --- State ---
        let appState = { data: [] };
        let knownAsins = new Set();
        const checkInterval = 600;
        let secondsLeft = checkInterval;
        let countdownTimer = null;
        let isFetching = false;
        let currentStoreFilter = 'all';
        let currentCategoryFilter = 'all';
        let searchQuery = '';

        // --- DOM ---
        const gridContainer = document.getElementById('grid-container');
        const emptyState = document.getElementById('empty-state');
        const skeletonLoader = document.getElementById('skeleton-loader');
        const labelLastCheck = document.getElementById('label-last-check');
        const labelLastCheckMobile = document.getElementById('label-last-check-mobile');
        const labelTimer = document.getElementById('label-timer');
        const labelTimerMobile = document.getElementById('label-timer-mobile');
        const btnRefresh = document.getElementById('btn-refresh');
        const spinner = document.getElementById('spinner');
        const refreshIcon = document.getElementById('refresh-icon');
        const itemCounter = document.getElementById('item-counter');
        const sortSelect = document.getElementById('sort-select');
        const searchInput = document.getElementById('search-input');
        const categorySelect = document.getElementById('category-select');
        const storeButtons = document.querySelectorAll('.store-filter');
        const activeFiltersContainer = document.getElementById('active-filters');

        // --- Notifications ---
        function triggerPushNotification(deal) {
            if (Notification.permission === 'granted') {
                new Notification("🚨 Nova Oferta no PagaMeno$!", {
                    body: `${deal.title.substring(0, 55)}... por R$ ${deal.current_price}`,
                    icon: deal.image || "https://www.amazon.com.br/favicon.ico",
                    tag: deal.asin,
                    badge: "https://www.amazon.com.br/favicon.ico"
                });
            }
        }

        // --- Store Filter Logic ---
        storeButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                storeButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentStoreFilter = btn.dataset.store;
                
                storeButtons.forEach(b => {
                    const dot = b.querySelector('span');
                    if(!dot) return;
                    if(b.classList.contains('active')) {
                        dot.className = 'w-1.5 h-1.5 rounded-full bg-brand-green';
                    } else {
                        dot.className = 'w-1.5 h-1.5 rounded-full bg-neutral-500';
                    }
                });
                
                updateUI();
            });
        });

        // --- Category Filter ---
        categorySelect.addEventListener('change', (e) => {
            currentCategoryFilter = e.target.value;
            updateUI();
        });

        // --- Search Logic ---
        let searchTimeout;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                searchQuery = e.target.value.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
                updateUI();
            }, 200);
        });

        // --- Active Filters Tags ---
        function renderActiveFilters() {
            const tags = [];
            
            if (currentStoreFilter !== 'all') {
                tags.push({ type: 'store', label: currentStoreFilter === 'ml' ? 'Mercado Livre' : 'Amazon' });
            }
            if (currentCategoryFilter !== 'all') {
                tags.push({ type: 'category', label: currentCategoryFilter });
            }
            if (searchQuery) {
                tags.push({ type: 'search', label: `"${searchInput.value}"` });
            }

            if (tags.length === 0) {
                activeFiltersContainer.classList.add('hidden');
                return;
            }

            activeFiltersContainer.classList.remove('hidden');
            activeFiltersContainer.innerHTML = tags.map(tag => `
                <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-brand-green/10 border border-brand-green/20 text-brand-green text-xs font-semibold">
                    ${tag.label}
                    <button onclick="clearFilter('${tag.type}')" class="hover:text-white transition-colors">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </span>
            `).join('');
        }

        window.clearFilter = function(type) {
            if (type === 'store') {
                currentStoreFilter = 'all';
                storeButtons.forEach(b => {
                    b.classList.toggle('active', b.dataset.store === 'all');
                    const dot = b.querySelector('span');
                    if(dot) dot.className = b.dataset.store === 'all' ? 'w-1.5 h-1.5 rounded-full bg-brand-green' : 'w-1.5 h-1.5 rounded-full bg-neutral-500';
                });
            } else if (type === 'category') {
                currentCategoryFilter = 'all';
                categorySelect.value = 'all';
            } else if (type === 'search') {
                searchQuery = '';
                searchInput.value = '';
            }
            updateUI();
        };

        // --- Sort & Filter ---
        function getProcessedDeals() {
            if (!appState.data || appState.data.length === 0) return [];
            
            let deals = [...appState.data];

            // Store filter
            if (currentStoreFilter !== 'all') {
                deals = deals.filter(d => {
                    const isML = d.link && d.link.includes('mercadolivre.com.br');
                    return currentStoreFilter === 'ml' ? isML : !isML;
                });
            }

            // Category filter
            if (currentCategoryFilter !== 'all') {
                deals = deals.filter(d => d.category === currentCategoryFilter);
            }

            // Search filter
            if (searchQuery) {
                deals = deals.filter(d => {
                    const text = (d.title + ' ' + (d.category || '') + ' ' + (d.badge || '')).toLowerCase()
                        .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
                    return text.includes(searchQuery);
                });
            }

            // Sort
            const sortType = sortSelect.value;
            deals.sort((a, b) => {
                if (sortType === 'recent') {
                    if (a.is_new !== b.is_new) return a.is_new ? -1 : 1;
                    return b.discovery_ts - a.discovery_ts;
                } else if (sortType === 'price_asc') {
                    return a.current_price - b.current_price;
                } else if (sortType === 'price_desc') {
                    return b.current_price - a.current_price;
                } else if (sortType === 'discount_desc') {
                    return b.discount - a.discount;
                }
                return 0;
            });

            return deals;
        }

        function updateUI() {
            const deals = getProcessedDeals();
            renderDeals(deals);
            renderActiveFilters();
        }

        function renderDeals(deals) {
            itemCounter.textContent = deals.length;

            if (!deals || deals.length === 0) {
                gridContainer.innerHTML = '';
                gridContainer.classList.add('hidden');
                emptyState.classList.remove('hidden');
                skeletonLoader.classList.add('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            skeletonLoader.classList.add('hidden');
            gridContainer.classList.remove('hidden');

            const cardsHTML = deals.map((deal, index) => {
                const isML = deal.link && deal.link.includes('mercadolivre.com.br');
                const storeName = isML ? 'Mercado Livre' : 'Amazon';
                const btnClass = isML ? 'btn-ml' : 'btn-amazon';
                const storeIcon = isML 
                    ? '<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>'
                    : '<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>';
                
                const discountBadge = deal.discount > 0 
                    ? `<div class="absolute top-3 right-3 discount-badge text-white text-[11px] font-black px-2.5 py-1 rounded-lg shadow-lg z-10">-${Math.round(deal.discount)}%</div>` : '';
                
                const dateObj = new Date(deal.discovery_ts * 1000);
                const timeString = dateObj.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
                const dateString = dateObj.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
                
                const timeBadge = `<div class="absolute top-3 left-3 bg-black/70 backdrop-blur-md text-neutral-300 text-[10px] font-mono font-medium px-2 py-1 rounded-lg border border-white/10 z-10 flex items-center gap-1">
                    <svg class="w-3 h-3 text-brand-green" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    ${dateString} ${timeString}
                </div>`;
                    
                const originalPriceLine = deal.original_price && deal.original_price !== 'N/A' 
                    ? `<span class="text-xs text-neutral-500 line-through font-medium">R$ ${deal.original_price}</span>` : '';
                    
                const criteriaBadges = (deal.criteria || []).slice(0, 3).map(crit => `
                    <span class="inline-flex items-center bg-neutral-800/80 text-neutral-400 text-[10px] font-medium px-2 py-0.5 rounded-md border border-neutral-700/50 whitespace-nowrap">${crit}</span>
                `).join('');

                const imageHTML = deal.image 
                    ? `<img src="${deal.image}" alt="${deal.title}" class="w-full h-full object-contain p-4 mix-blend-multiply transition-transform duration-500 group-hover:scale-105" referrerpolicy="no-referrer" loading="lazy">`
                    : `<div class="w-full h-full flex flex-col items-center justify-center text-neutral-600 gap-2"><svg class="w-8 h-8 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg><span class="text-xs">Sem imagem</span></div>`;

                const categoryColor = isML ? 'text-yellow-400' : 'text-brand-green';
                const cleanCategory = (deal.category || '').replace(/[\[\]]/g, '').trim();
                const cleanBadge = (deal.badge || 'Oferta Ativa').replace(/[\[\]]/g, '').trim();

                return `
                    <article class="group bg-brand-card border border-brand-border rounded-2xl overflow-hidden flex flex-col card-hover animate-fade-in" style="animation-delay: ${index * 0.03}s">
                        <div class="relative bg-white aspect-[4/3] overflow-hidden">
                            ${imageHTML}
                            ${timeBadge}
                            ${discountBadge}
                        </div>
                        
                        <div class="p-4 flex-1 flex flex-col gap-3">
                            <div class="flex items-start justify-between gap-2">
                                <div class="flex-1 min-w-0">
                                    <div class="flex items-center gap-2 mb-1.5">
                                        <span class="text-[10px] font-bold uppercase tracking-wider ${categoryColor} bg-white/5 px-1.5 py-0.5 rounded border border-white/5 truncate">
                                            ${cleanBadge}
                                        </span>
                                        ${cleanCategory ? `<span class="text-[10px] font-medium uppercase tracking-wider text-neutral-500 truncate">${cleanCategory}</span>` : ''}
                                    </div>
                                    <h2 class="text-sm font-semibold text-neutral-200 leading-snug line-clamp-2 group-hover:text-white transition-colors" title="${deal.title}">
                                        ${deal.title}
                                    </h2>
                                </div>
                            </div>

                            <div class="mt-auto pt-2 border-t border-neutral-800">
                                <div class="flex items-baseline gap-2 mb-2">
                                    <span class="text-lg font-black text-brand-green tracking-tight">R$ ${deal.current_price.toFixed(2)}</span>
                                    ${originalPriceLine}
                                </div>
                                ${criteriaBadges ? `<div class="flex flex-wrap gap-1 mb-3">${criteriaBadges}</div>` : '<div class="mb-3"></div>'}
                                <a href="${deal.link}" target="_blank" rel="noopener noreferrer" class="w-full flex items-center justify-center gap-2 ${btnClass} font-bold py-2.5 rounded-xl text-xs transition-all active:scale-[0.98]">
                                    ${storeIcon}
                                    <span>Ver ${storeName === 'Amazon' ? 'na' : 'no'} ${storeName}</span>
                                    <svg class="w-3.5 h-3.5 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                                </a>
                            </div>
                        </div>
                    </article>
                `;
            }).join('');

            gridContainer.innerHTML = cardsHTML;
        }

        // --- Data Fetching ---
        async function fetchUpdatedDeals() {
            if (isFetching) return;
            isFetching = true;
            spinner.classList.remove('hidden');
            refreshIcon.classList.add('hidden');
            btnRefresh.disabled = true;

            try {
                const response = await fetch('deals.json?t=' + new Date().getTime());
                const newState = await response.json();
                
                if (newState && newState.data) {
                    let hasNewItems = false;
                    newState.data.forEach(deal => {
                        if (!knownAsins.has(deal.asin)) {
                            knownAsins.add(deal.asin);
                            hasNewItems = true;
                            if (appState.data && appState.data.length > 0) {
                                triggerPushNotification(deal);
                            }
                        }
                    });

                    appState = newState;
                    const lastCheckText = `Último: ${newState.last_check}`;
                    labelLastCheck.textContent = lastCheckText;
                    labelLastCheckMobile.textContent = lastCheckText;
                    updateUI();
                }
            } catch (err) {
                console.error("Falha ao puxar JSON:", err);
                labelLastCheck.textContent = "Último: Erro na atualização";
                labelLastCheckMobile.textContent = "Erro na atualização";
            } finally {
                isFetching = false;
                spinner.classList.add('hidden');
                refreshIcon.classList.remove('hidden');
                btnRefresh.disabled = false;
                resetTimer();
            }
        }

        // --- Timer ---
        function startTimer() {
            if (countdownTimer) clearInterval(countdownTimer);
            countdownTimer = setInterval(() => {
                secondsLeft--;
                if (secondsLeft <= 0) {
                    fetchUpdatedDeals();
                } else {
                    const mins = Math.floor(secondsLeft / 60);
                    const secs = secondsLeft % 60;
                    const text = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                    labelTimer.textContent = text;
                    labelTimerMobile.textContent = text;
                }
            }, 1000);
        }

        function resetTimer() {
            secondsLeft = checkInterval;
            startTimer();
        }

        // --- Event Listeners ---
        btnRefresh.addEventListener('click', fetchUpdatedDeals);
        sortSelect.addEventListener('change', updateUI);

        // --- Init ---
        window.onload = () => {
            if ("Notification" in window && Notification.permission === 'default') {
                const btnNotif = document.getElementById('btn-notification');
                btnNotif.classList.remove('hidden');
                btnNotif.classList.add('flex');
                btnNotif.addEventListener('click', async () => {
                    const perm = await Notification.requestPermission();
                    if (perm === 'granted') btnNotif.classList.add('hidden');
                });
            }
            fetchUpdatedDeals();
        };
    </script>
</body>
</html>
