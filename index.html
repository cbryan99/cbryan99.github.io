<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PagaMeno$ — Entre no Grupo</title>
<link rel="icon" type="image/png" href="pagamenos-logo.png" />
<link rel="apple-touch-icon" href="pagamenos-logo.png" />

<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-dark:#1f232a;
    --bg-darker:#15181d;
    --green:#3ddc84;
    --green-dark:#1f9b54;
    --gold:#ffd23f;
    --gold-dark:#d9a517;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }

  body{
    font-family:'Fredoka', sans-serif;
    background:
      radial-gradient(circle at 20% 10%, rgba(61,220,132,0.12), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(255,210,63,0.12), transparent 45%),
      linear-gradient(180deg,#1f232a 0%, #15181d 100%);
    color:#fff;
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }

  #money-layer{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
    overflow:hidden;
  }

  .money-item, .money-bill {
    position: absolute;
    will-change: transform, opacity;
    user-select: none;
  }

  .money-bill{
    width: 80px;
    height: 46px;
    border-radius: 6px;
    background: linear-gradient(135deg, #3ddc84 0%, #2bb56b 50%, #1f9b54 100%);
    border: 2px solid #0a3a1f;
    box-shadow:
      inset 0 0 0 2px rgba(255,255,255,0.25),
      0 6px 14px rgba(0,0,0,0.4);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-family:'Lilita One', sans-serif;
    font-size: 22px;
    text-shadow: 1px 1px 0 #0a3a1f;
  }
  .money-bill::before, .money-bill::after{
    content:"";
    position:absolute;
    width:8px; height:8px;
    border-radius:50%;
    background:#15181d;
    border:2px solid #0a3a1f;
  }
  .money-bill::before{ left:5px; top:50%; transform:translateY(-50%); }
  .money-bill::after{ right:5px; top:50%; transform:translateY(-50%); }

  .money-bill.gold{
    background: linear-gradient(135deg, #ffe066 0%, #ffd23f 50%, #d9a517 100%);
    border-color:#5c4408;
    color:#5c4408;
    text-shadow: 1px 1px 0 #ffe066;
  }
  .money-bill.gold::before, .money-bill.gold::after{
    background:#5c4408;
    border-color:#5c4408;
  }

  .dollar-sign{
    font-family:'Lilita One', sans-serif;
    font-weight: 900;
    color: var(--gold);
    text-shadow:
      2px 2px 0 #5c4408,
      -1px -1px 0 rgba(255,255,255,0.2);
    line-height:1;
  }

  .stage{
    position:relative;
    z-index: 10;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding: 40px 20px;
  }

  .glass-card{
    background: rgba(33, 38, 46, 0.72);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow:
      0 20px 60px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.06);
  }

  .logo-wrapper{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    animation: logoBob 4s ease-in-out infinite;
  }

  .logo-glow{
    position:absolute;
    inset: -20px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(61,220,132,0.3) 0%, rgba(255,210,63,0.15) 40%, transparent 70%);
    filter: blur(24px);
    z-index: -1;
    animation: glowPulse 3s ease-in-out infinite alternate;
  }

  @keyframes glowPulse{
    0%{ opacity: 0.6; transform: scale(0.9); }
    100%{ opacity: 1; transform: scale(1.1); }
  }
  @keyframes logoBob{
    0%,100%{ transform: translateY(0); }
    50%{ transform: translateY(-8px); }
  }

  .text-logo-container {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transform: rotate(-3deg);
    filter: drop-shadow(0 6px 2px rgba(0, 0, 0, 0.6));
    user-select: none;
    margin-top: 10px;
  }

  /*
    Fix 1: Textura Papel Moeda.
    Blend-mode multiply mescla o fractal base64 com o verde.
  */
  .logo-paga {
    font-family: 'Lilita One', sans-serif;
    font-size: 4.5rem;
    line-height: 1;
    padding-bottom: 8px;
    margin-bottom: -32px;
    background-image:
      url("data:image/svg+xml;utf8,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.35'/%3E%3C/svg%3E"),
      linear-gradient(180deg, #3ddc84 0%, #1f9b54 100%);
    background-blend-mode: multiply; /* O segredo que faltava pra mesclar */
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    -webkit-text-stroke: 2px #0a3a1f;
    letter-spacing: 2px;
    margin-left: -20px;
    z-index: 2;
  }

  /*
    Fix 2: Reflexo de Ouro
    Curva de aceleração brusca (cubic-bezier) com gradiente mais fechado.
  */
  .logo-menos {
    font-family: 'Lilita One', sans-serif;
    font-size: 5.5rem;
    line-height: 0.85;
    background: linear-gradient(-60deg, #ffd23f 35%, #ffffff 45%, #ffd23f 55%, #d9a517 100%);
    background-size: 300% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    -webkit-text-stroke: 2px #5c4408;
    animation: goldShimmer 5s cubic-bezier(0.25, 1, 0.5, 1) infinite;
    z-index: 3;
  }

  /* Animação que dá o flash rápido e resfria */
  @keyframes goldShimmer {
    0% { background-position: 150% center; }
    20% { background-position: -50% center; }
    100% { background-position: -50% center; }
  }

  .invite-title{
    font-family:'Lilita One', sans-serif;
    background: linear-gradient(180deg, #ffffff 0%, #ffd23f 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    letter-spacing: 1px;
  }

  .cta-btn{
    position:relative;
    overflow:hidden;
    transition: transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .25s ease;
    border-radius: 18px;
    font-family:'Lilita One', sans-serif;
    letter-spacing: 0.5px;
  }
  .cta-btn:hover{ transform: translateY(-4px) scale(1.02); }
  .cta-btn:active{ transform: translateY(-1px) scale(0.99); }

  .cta-telegram{
    background: linear-gradient(135deg, #2aabee 0%, #229ed9 60%, #1c7bb8 100%);
    box-shadow: 0 10px 30px rgba(42,171,238,0.4), inset 0 1px 0 rgba(255,255,255,0.25), inset 0 -3px 0 rgba(0,0,0,0.2);
    border: 2px solid #1c7bb8;
  }
  .cta-telegram:hover{ box-shadow: 0 16px 40px rgba(42,171,238,0.55), inset 0 1px 0 rgba(255,255,255,0.3), inset 0 -3px 0 rgba(0,0,0,0.2); }

  .cta-whatsapp{
    background: linear-gradient(135deg, #4ff07a 0%, #25d366 60%, #128c47 100%);
    box-shadow: 0 10px 30px rgba(37,211,102,0.4), inset 0 1px 0 rgba(255,255,255,0.3), inset 0 -3px 0 rgba(0,0,0,0.2);
    border: 2px solid #128c47;
  }
  .cta-whatsapp:hover{ box-shadow: 0 16px 40px rgba(37,211,102,0.55), inset 0 1px 0 rgba(255,255,255,0.3), inset 0 -3px 0 rgba(0,0,0,0.2); }

  .cta-btn::after{
    content:"";
    position:absolute;
    top:0; left:-150%;
    width:60%; height:100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.35), transparent);
    transform: skewX(-20deg);
    animation: shine 3.5s ease-in-out infinite;
  }
  @keyframes shine{
    0%{ left:-150%; }
    60%{ left:150%; }
    100%{ left:150%; }
  }

  .divider-star{ color: var(--gold); text-shadow: 0 0 8px rgba(255,210,63,0.5); }
  .money-bill.small{ width:50px; height:28px; font-size:14px; }
  .money-bill.medium{ width:80px; height:46px; font-size:22px; }
  .money-bill.large{ width:110px; height:62px; font-size:30px; }

  @media (prefers-reduced-motion: reduce){
    .logo-wrapper, .logo-glow, .cta-btn::after, .logo-menos { animation: none; }
  }

  .sparkle{
    position:absolute;
    color: var(--white);
    font-size: 14px;
    animation: twinkle 2s ease-in-out infinite;
    z-index: 4;
    text-shadow: 0 0 6px rgba(255,255,255,0.8);
  }
  @keyframes twinkle{
    0%,100%{ opacity:0.2; transform:scale(0.6) rotate(0deg); }
    50%{ opacity:1; transform:scale(1.2) rotate(15deg); }
  }
</style>
</head>
<body>

  <div id="money-layer" aria-hidden="true"></div>

  <main class="stage">
    <div class="logo-wrapper mb-6 mt-4">
      <div class="logo-glow"></div>

      <div class="text-logo-container">
        <span class="sparkle" style="top:-5px; right:15px; animation-delay:0s; font-size:24px;">✦</span>
        <span class="sparkle" style="bottom:15px; left:-25px; animation-delay:0.6s; font-size:18px;">✦</span>
        <span class="sparkle" style="top:40%; right:-30px; animation-delay:1.2s; font-size:14px;">✦</span>

        <span class="logo-paga">Paga</span>
        <span class="logo-menos">Meno$</span>
      </div>
    </div>

    <section class="glass-card rounded-3xl px-6 py-8 sm:px-10 sm:py-10 max-w-md w-full text-center">
      <h1 class="invite-title text-3xl sm:text-4xl mb-2 mt-2">Bora economizar?</h1>
      <p class="text-[#cfd6df] text-sm sm:text-base mb-7">
        Entre nos grupos oficiais e receba sinais todos os dias e toda hora.
      </p>

      <div class="flex items-center gap-3 my-6 opacity-70">
        <span class="flex-1 h-px bg-gradient-to-r from-transparent via-white/30 to-transparent"></span>
        <span class="divider-star">★</span>
        <span class="flex-1 h-px bg-gradient-to-r from-transparent via-white/30 to-transparent"></span>
      </div>

      <div id="cta-container" class="flex flex-col gap-4">
        <a href="https://t.me/pagamenos_promo" target="_blank" rel="noopener noreferrer"
           class="cta-btn cta-telegram flex items-center justify-center gap-3 px-6 py-4 text-white text-lg">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true">
            <path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/>
          </svg>
          <span>Entrar no Telegram</span>
        </a>

        <a href="https://chat.whatsapp.com/HKaPfEzHQlL29ht6Ks3RHW" target="_blank" rel="noopener noreferrer"
           class="cta-btn cta-whatsapp flex items-center justify-center gap-3 px-6 py-4 text-white text-lg">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true">
            <path d="M17.47 14.38c-.3-.15-1.74-.86-2-.96-.27-.1-.47-.15-.66.15-.2.3-.76.96-.94 1.16-.17.2-.35.22-.64.07-.3-.15-1.25-.46-2.38-1.47-.88-.78-1.47-1.75-1.64-2.05-.17-.3-.02-.46.13-.6.13-.14.3-.35.45-.53.15-.18.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.66-1.6-.9-2.18-.24-.58-.48-.5-.66-.5-.17 0-.37-.02-.57-.02-.2 0-.52.07-.8.37-.27.3-1.04 1.02-1.04 2.48 0 1.46 1.07 2.87 1.22 3.07.15.2 2.1 3.2 5.08 4.48.71.31 1.26.49 1.7.63.71.23 1.36.2 1.87.12.57-.09 1.74-.71 1.98-1.4.25-.69.25-1.28.17-1.4-.07-.13-.27-.2-.57-.35zM12 2a10 10 0 0 0-8.6 15.04L2 22l5.06-1.32A10 10 0 1 0 12 2zm0 18.13a8.13 8.13 0 0 1-4.14-1.13l-.3-.18-3 .78.8-2.93-.2-.3A8.13 8.13 0 1 1 12 20.13z"/>
          </svg>
          <span>Entrar no WhatsApp</span>
        </a>
      </div>
    </section>
  </main>

<script>
  const layer = document.getElementById('money-layer');
  const sizes = ['small', 'medium', 'large'];

  function createItem(type, isInitial = false){
    const el = document.createElement('div');

    const startX = Math.random() * window.innerWidth;
    const startY = isInitial
      ? (Math.random() * window.innerHeight)
      : (window.innerHeight + 60);

    const endRot = (Math.random() * 720 + 360) + 'deg';
    const maxOpacity = type === 'bill' ? (0.5 + Math.random() * 0.35) : (0.3 + Math.random() * 0.4);

    const duration = (type === 'bill' ? 5 : 6) + Math.random() * 4;

    if(type === 'bill'){
      const isGold = Math.random() > 0.55;
      const size = sizes[Math.floor(Math.random() * sizes.length)];
      el.className = `money-bill ${size}${isGold ? ' gold' : ''}`;
      el.textContent = '$';
    } else {
      el.className = 'money-item dollar-sign';
      const size = [28, 36, 48, 60, 72][Math.floor(Math.random() * 5)];
      el.style.fontSize = size + 'px';
    }

    el.style.left = startX + 'px';
    el.style.top = startY + 'px';

    layer.appendChild(el);

    const cta = document.getElementById('cta-container');
    const rect = cta.getBoundingClientRect();

    const targetX = rect.left + (rect.width / 2);
    const targetY = rect.top + (rect.height / 2);

    const deltaX = targetX - startX;
    const deltaY = targetY - startY;

    const anim = el.animate([
      { transform: 'translate3d(0, 0, 0) rotate(0deg) scale(1)', opacity: 0 },
      { opacity: maxOpacity, offset: 0.1 },
      { opacity: maxOpacity, offset: 0.75 },
      { transform: `translate3d(${deltaX}px, ${deltaY}px, 0) rotate(${endRot}) scale(0)`, opacity: 0 }
    ], {
      duration: duration * 1000,
      easing: 'cubic-bezier(0.55, 0.085, 0.68, 0.53)',
      fill: 'forwards'
    });

    anim.onfinish = () => el.remove();
  }

  function spawnInitial(){
    const total = 25;
    for(let i = 0; i < total; i++){
      const type = Math.random() > 0.4 ? 'bill' : 'sign';
      createItem(type, true);
    }
  }

  function spawnLoop(){
    const type = Math.random() > 0.05 ? 'bill' : 'sign';
    createItem(type, false);
  }

  spawnInitial();

  setInterval(spawnLoop, 800);
</script>
</body>
</html>
